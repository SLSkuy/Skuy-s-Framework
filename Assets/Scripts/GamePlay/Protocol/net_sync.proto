syntax = "proto3";

package NetSync;

message Vec2 {
    float x = 1;
    float y = 2;
}

message Vec3 {
    float x = 1;
    float y = 2;
    float z = 3;
}

message Quat {
    float x = 1;
    float y = 2;
    float z = 3;
    float w = 4;
}

// ========== 玩家数据 ==========
// ========== 玩家数据 ==========
// ========== 玩家数据 ==========

message PlayerInfoDataProto  {
    string UUID = 1;
    string playerName = 2;
}

// ========== 玩家数据 ==========
// ========== 玩家数据 ==========
// ========== 玩家数据 ==========



// ========== 房间数据 ==========
// ========== 房间数据 ==========
// ========== 房间数据 ==========

message RoomConfigProto {
    string hostUUID = 1;    // 房主UUID
    bool acceptRemoteJoin = 2;   // 是否接受远端连接（考虑后面房间设置可能会变更） 
    int32 capacity = 3; // 房间容量
}

// ========== 房间数据 ==========
// ========== 房间数据 ==========
// ========== 房间数据 ==========



// ========== 房间管理 ==========
// ========== 房间管理 ==========
// ========== 房间管理 ==========

message Room_Join_Request {
    PlayerInfoDataProto player = 1;
}

message Room_Join_Response {
    bool accepted = 1;    // 是否接收加入请求
    RoomConfigProto roomCfg = 2;
    repeated PlayerInfoDataProto remotes = 3;    // 房间内玩家消息
}

// 通知新的玩家加入房间
message Room_Player_Joined_Notify {
    PlayerInfoDataProto player = 1;    // 新加入玩家UUID
}

message Room_Leave_Request {
    string UUID = 1;
}

// 玩家退出通知
message Room_Player_Leave_Notify {
    string UUID = 1;
}

// 房主退出，服务器销毁通知
message Room_Server_Dissolved_Notify{
}

// ========== 房间管理 ==========
// ========== 房间管理 ==========
// ========== 房间管理 ==========



// ========== 控制命令 ==========
// ========== 控制命令 ==========
// ========== 控制命令 ==========

// 本机玩家输入。玩家由发送这条消息的连接决定
// 最新一拍同时写在顶层字段里；recent_inputs 带上最近若干拍，供主机补上迟到或丢失的指令
message Player_Inputs {
    Input_Command current_inputs = 1;
    repeated Input_Command recent_inputs = 2;
}

// 每Tick玩家输入抽象
message Input_Command {
    uint32 inputTick = 1;
    Vec2 move_input = 2;
    Vec2 aim_input = 3;
    bool is_primary_attack_pressed = 4;
    bool is_special_attack_pressed = 5;
    bool is_special_action_pressed = 6;
    bool is_interact_pressed = 7;
    bool is_sprint_pressed = 8;
    bool is_jump_pressed = 9;
    bool is_switch_mode_pressed = 10;
}

// ========== 控制命令 ==========
// ========== 控制命令 ==========
// ========== 控制命令 ==========



// ========== 快照 ==========
// ========== 快照 ==========
// ========== 快照 ==========

// 玩家实体在某一Tick的状态
message Player_Snapshot {
    uint32 entityId = 1;
    uint32 locomotion_state = 2;
    Vec3 position = 3;
    Quat rotation = 4;
    Quat view_rotation = 5;
    Vec3 linear_velocity = 6;
    Vec3 angular_velocity = 7;
    uint32 lastProcessedInputTick = 8;
    float vertical_velocity = 9;
    int32 jump_count = 10;
    bool is_running = 11;
    bool is_sprinting = 12;
    bool is_dashing = 13;
    bool is_grounded = 14;
    Vec3 dash_direction = 15;
    float dash_remaining_time = 16;
    float desired_locomotion_speed = 17;
    float applied_locomotion_speed = 18;
    Vec3 last_move_direction = 19;
}

message World_Snapshot {
    uint32 snapshotTick = 1;
    repeated Player_Snapshot Player_snapshots = 2;
}

// ========== 快照 ==========
// ========== 快照 ==========
// ========== 快照 ==========



// ========== 战局事件 ==========
// ========== 战局事件 ==========
// ========== 战局事件 ==========

// 玩家实体生成通知
message Player_Spawn_Notify {
    uint32 entityId = 1;
    uint32 entityTypeId = 2;
    string playerId = 3;
    Vec3 position = 4;
    Quat rotation = 5;
    Player_Snapshot snapshot = 6;
}

// 主机通知客户端销毁实体
message Entity_Destroy_Notify {
    uint32 entityId = 1;
}

// 客户端关卡就绪后，向主机请求已有实体
message Entity_Spawn_Sync_Request {
}

