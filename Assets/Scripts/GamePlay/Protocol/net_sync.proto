syntax = "proto3";

package NetSync;

message Vec2 {
  float x = 1;
  float y = 2;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// 玩家输入命令
message Player_Input {
  uint32 entityId = 1;
  uint32 inputTick = 2;
  Vec2 move_input = 3;
  Vec2 aim_input = 4;
  bool is_primary_attack_pressed = 5;
  bool is_special_attack_pressed = 6;
  bool is_special_action_pressed = 7;
  bool is_interact_pressed = 8;
  bool is_sprint_pressed = 9;
  bool is_jump_pressed = 10;
  bool is_switch_mode_pressed = 11;
}

// 位移状态快照
message Transform_Snapshot {
  uint32 entityId = 1;
  uint32 snapshotTick = 2;
  uint32 lastProcessedInputTick = 3;
  Vec3 position = 4;
  Vec3 rotation = 5;
  Vec3 velocity = 6;
  uint32 movementState = 7;
}

message World_Snapshot {
  uint32 snapshotTick = 1;
  repeated Transform_Snapshot transform_snapshots = 2;
}

// ========== 加入游戏 ==========
message Game_Join_Request {
  uint32 clientId = 1;
}

message Game_Join_Response {
  bool accepted = 1;
}
// ========== 加入游戏 ==========
